name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p interview-core
  frontend-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node scripts/test-background-ui.cjs
      - run: node scripts/test-session-memory.cjs
      - run: node scripts/test-memory-settings.cjs
      - run: python3 -m pip install -r interview/requirements.txt
      - run: python3 scripts/test-background-harness.py
      - run: python3 scripts/test-background-process-recovery.py
      - run: python3 -B scripts/test-toolkit-harness.py
      - run: python3 -B scripts/test-toolkit-preparation.py
      - run: python3 -B scripts/test-toolkit-consolidation.py
      - run: node scripts/test-public-source.cjs
      - run: python3 scripts/test-interview-monitor.py
      - run: pnpm exec tsc --noEmit --incremental false
        working-directory: frontend
      - run: python3 scripts/check-public-source.py
