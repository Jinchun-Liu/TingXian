name: Windows native video source
on:
  push:
    branches: [feat/windows-eye-local-20261106, feat/windows-eye-output-20261107]
    paths: ['video/windows/**', 'video/eye/**', 'audio/windows/**', 'crates/video-worker-control/**', 'Cargo.lock', '.github/workflows/video-source-checks.yml']
  pull_request:
    paths: ['video/windows/**', 'video/eye/**', 'audio/windows/**', 'crates/video-worker-control/**', 'Cargo.lock', '.github/workflows/video-source-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-native-source:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure native component
        run: cmake -S video/windows -B "$env:RUNNER_TEMP/video-source-build" -A x64
      - name: Build native component
        run: cmake --build "$env:RUNNER_TEMP/video-source-build" --config Release --parallel 2
      - name: Test real COM samples without registering a camera
        run: ctest --test-dir "$env:RUNNER_TEMP/video-source-build" -C Release --output-on-failure
      - name: Build SDK-free eye process fixture
        run: |
          cmake -S video/eye -B "$env:RUNNER_TEMP/eye-worker-build" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/eye-worker-build" --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/eye-worker-build" -C Release --output-on-failure
      - name: Build audio adapter and test without streams
        run: |
          cmake -S audio/windows -B "$env:RUNNER_TEMP/audio-output-build" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/audio-output-build" --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/audio-output-build" -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Test main-controller and native worker without media
        run: |
          $env:TINGXIAN_VIDEO_TEST_BIN = "$env:RUNNER_TEMP/video-source-build/Release"
          $env:TINGXIAN_EYE_TEST_BIN = "$env:RUNNER_TEMP/eye-worker-build/Release"
          $env:TINGXIAN_AUDIO_TEST_BIN = "$env:RUNNER_TEMP/audio-output-build/Release"
          $env:TINGXIAN_VIDEO_TEST_ROOT = "$env:RUNNER_TEMP/video-controller-fixtures"
          cargo test -p video-worker-control --locked -- --test-threads=1 2>&1 | Tee-Object "$env:RUNNER_TEMP/video-source-build/controller-test.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $test = @(Get-ChildItem target/debug/deps/video_worker_control-*.exe)
          if ($test.Count -ne 1) { throw 'Expected one controller test executable' }
          Copy-Item -LiteralPath $test[0].FullName -Destination "$env:RUNNER_TEMP/video-source-build/Release/tingxian-video-controller-test.exe"
      - name: Public source check
        run: python -I -B scripts/check-public-source.py
      - name: Preserve native test binaries and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TingXian-video-source-synthetic-only
          path: |
            ${{ runner.temp }}/video-source-build/Release/TingXianVideoSource.dll
            ${{ runner.temp }}/video-source-build/Release/TingXianVideoOutput.dll
            ${{ runner.temp }}/video-source-build/Release/tingxian-camera-input-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-camera-input.lib
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-source-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-timing-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-timed-output-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-ipc-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-eye-output-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-eye-output.lib
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-session-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-worker-owner-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-worker.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-worker-fixture.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-controller-test.exe
            ${{ runner.temp }}/video-source-build/controller-test.log
            ${{ runner.temp }}/eye-worker-build/Release/tingxian-eye-worker-fixture.exe
            ${{ runner.temp }}/eye-worker-build/Release/tingxian-eye-session-test.exe
            ${{ runner.temp }}/eye-worker-build/Release/tingxian-eye-stream-test.exe
            ${{ runner.temp }}/eye-worker-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-device-probe.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-device-synthetic-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-registration-test.exe
            ${{ runner.temp }}/video-source-build/Release/tingxian-video-session.lib
            ${{ runner.temp }}/video-source-build/Testing/Temporary/LastTest.log
            video/windows/LICENSE-Microsoft.txt
            video/windows/THIRD-PARTY.md
            ${{ runner.temp }}/audio-output-build/Release/tingxian-audio-output.lib
            ${{ runner.temp }}/audio-output-build/Release/TingXianAudioOutput.dll
            ${{ runner.temp }}/audio-output-build/Release/TingXianAudioFixture.dll
            ${{ runner.temp }}/audio-output-build/Release/tingxian-audio-output-test.exe
            ${{ runner.temp }}/audio-output-build/Release/tingxian-audio-probe.exe
            ${{ runner.temp }}/audio-output-build/Release/TingXianAudioCapture.dll
            ${{ runner.temp }}/audio-output-build/Release/tingxian-audio-input-test.exe
            ${{ runner.temp }}/audio-output-build/Release/tingxian-audio-input-probe.exe
            ${{ runner.temp }}/audio-output-build/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14
