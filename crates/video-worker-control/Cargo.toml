[package]
name = "video-worker-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_LibraryLoader"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_ApplicationInstallationAndServicing", "Win32_System_WindowsProgramming", "Win32_System_RemoteDesktop"] }
